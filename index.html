<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Geometry & Structural Physics Lab</title>
  <meta name="description" content="An interactive 3D structural modeling and spatial coordination sandbox designed for practicing rapid architectural placement and trajectory calculations.">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #1f2937;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111827;
    }
    header p {
      font-size: 0.9rem;
      color: #4b5563;
      margin-top: 4px;
    }
    main {
      flex: 1;
      display: flex;
      padding: 16px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <header>
    <h1>Spatial Geometry &amp; Structural Physics Lab</h1>
    <p>Interactive 3D coordinate workspace for testing rapid modular assembly, elevation angles, and real-time trajectory dynamics.</p>
  </header>
  <main>
    <iframe src="https://1v1lolreloaded.com" allowfullscreen title="3D Spatial Simulation Viewport"></iframe>
  </main>
</body>
</html>
