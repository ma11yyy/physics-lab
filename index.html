<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research & Reference Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    select, button {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    select {
      background-color: #334155;
    }
    button:hover {
      background-color: #2563eb;
    }
    main {
      flex: 1;
      display: flex;
      padding: 12px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Study &amp; Reference Portal</h1>
    <div class="controls">
      <select id="siteSelect" onchange="changeSite()" aria-label="Select Reference Tool">
        <option value="https://wikipedia.org">Wikipedia Encyclopedia</option>
        <option value="https://desmos.com">Desmos Graphing Calculator</option>
      </select>
      <button onclick="goFullscreen()">Fullscreen</button>
    </div>
  </header>
  <main>
    <iframe id="mainFrame" src="https://wikipedia.org" allowfullscreen title="Reference Viewport"></iframe>
  </main>

  <script>
    function changeSite() {
      const frame = document.getElementById('mainFrame');
      const select = document.getElementById('siteSelect');
      frame.src = select.value;
    }

    function goFullscreen() {
      const frame = document.getElementById('mainFrame');
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      }
    }
  </script>
</body>
</html>
