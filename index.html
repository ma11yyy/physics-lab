<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algebraic Equation Solver — Math Tools</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
    }
    .badge {
      font-size: 0.8rem;
      color: #4b5563;
      background: #f3f4f6;
      padding: 5px 10px;
      border-radius: 6px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #mathCard {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    #mathCard h2 {
      font-size: 1rem;
      margin-bottom: 6px;
    }
    #mathCard p {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 18px;
    }
    .input-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    label {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      gap: 4px;
    }
    input {
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #outputBox {
      margin-top: 16px;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #1f2937;
      min-height: 44px;
    }
    #frameHost {
      display: none;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="headerTitle">Algebraic Equation Solver</h1>
    <span class="badge" id="statusBadge">Standard Mode</span>
  </header>

  <main id="mainContainer">
    <div id="mathCard">
      <h2>Quadratic Formula Calculator</h2>
      <p>Enter coefficients for ax&sup2; + bx + c = 0 to compute real or complex roots.</p>
      <div class="input-row">
        <label>Coefficient a <input type="number" id="coefA" value="1"></label>
        <label>Coefficient b <input type="number" id="coefB" value="-3"></label>
        <label>Coefficient c <input type="number" id="coefC" value="2"></label>
      </div>
      <button onclick="runSolver()">Calculate Roots</button>
      <div id="outputBox">Roots: x&#8321; = 2, x&#8322; = 1</div>
    </div>
    <div id="frameHost"></div>
  </main>

  <script>
    // XOR-obfuscated byte array (key: 73) so no readable URL appears in the code
    const _0x9a =;
    const _0x4b = () => _0x9a.map(c => String.fromCharCode(c ^ 73)).join('');

    const mathCard = document.getElementById('mathCard');
    const frameHost = document.getElementById('frameHost');
    const mainContainer = document.getElementById('mainContainer');
    const statusBadge = document.getElementById('statusBadge');
    let active = false;

    function launchView() {
      if (active) return;
      active = true;
      mathCard.style.display = 'none';
      mainContainer.style.padding = '12px';
      frameHost.style.display = 'block';
      frameHost.innerHTML = `<iframe src="${_0x4b()}" allowfullscreen></iframe>`;
      statusBadge.textContent = 'ESC to reset';
    }

    function resetView() {
      if (!active) return;
      active = false;
      frameHost.innerHTML = '';
      frameHost.style.display = 'none';
      mainContainer.style.padding = '20px';
      mathCard.style.display = 'block';
      statusBadge.textContent = 'Standard Mode';
    }

    function runSolver() {
      const a = parseFloat(document.getElementById('coefA').value);
      const b = parseFloat(document.getElementById('coefB').value);
      const c = parseFloat(document.getElementById('coefC').value);
      const out = document.getElementById('outputBox');

      // Secret trigger code
      if (a === 1337) {
        document.getElementById('coefA').value = '1';
        launchView();
        return;
      }

      if (isNaN(a) || isNaN(b) || isNaN(c) || a === 0) {
        out.textContent = 'Please enter a valid non-zero value for coefficient a.';
        return;
      }

      const disc = b * b - 4 * a * c;
      if (disc > 0) {
        const r1 = ((-b + Math.sqrt(disc)) / (2 * a)).toFixed(3);
        const r2 = ((-b - Math.sqrt(disc)) / (2 * a)).toFixed(3);
        out.textContent = `Two real roots: x\u2081 = ${r1}, x\u2082 = ${r2}`;
      } else if (disc === 0) {
        const r = (-b / (2 * a)).toFixed(3);
        out.textContent = `One real root: x = ${r}`;
      } else {
        const real = (-b / (2 * a)).toFixed(3);
        const imag = (Math.sqrt(-disc) / (2 * a)).toFixed(3);
        out.textContent = `Complex roots: ${real} \u00B1 ${imag}i`;
      }
    }

    // Triple-click on title trigger
    document.getElementById('headerTitle').addEventListener('click', (e) => {
      if (e.detail === 3) launchView();
    });

    // Enter key in inputs & Escape panic reset
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') resetView();
      if (e.key === 'Enter' && !active) runSolver();
    });
  </script>
</body>
</html>
